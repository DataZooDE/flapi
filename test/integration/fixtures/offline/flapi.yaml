# Serverless-startup fixture: one cached endpoint over a local CSV, one plain endpoint.
# Used by test_serverless_startup.py and the runtime-image CI job (--network none).
project-name: offline-startup
project-description: Starts with no network and no data access
http-port: 8080
http-host: 0.0.0.0
template:
  path: ./sqls
duckdb:
  db_path: ":memory:"
ducklake:
  enabled: true
  alias: cache
  metadata-path: /tmp/flapi-offline-cache.ducklake
  data-path: /tmp/flapi-offline-cache-data/
connections:
  local:
    properties:
      path: ./data/cities.csv
