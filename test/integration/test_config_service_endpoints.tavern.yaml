---
test_name: Config Service Endpoint Management
marks:
  - integration
  - config-service
  - endpoints

stages:
  # Note: These tests assume config service is enabled with authentication
  # Adjust auth_headers fixture or add token as needed
  
  - name: List all endpoints
    request:
      url: "{base_url}/api/v1/_config/endpoints"
      method: GET
      headers:
        X-Config-Token: "test-token"
        Authorization: "Bearer test-token"
    response:
      status_code: [200, 401]  # 401 if token is invalid, adjust as needed

  # These two stages used to address `northwind/products/`, which does not
  # exist in this configuration, and accepted [200, 404, 401] - so they
  # asserted nothing at all, and were the stated justification for a
  # slugToPath tolerance that made every endpoint addressable by two names.
  # They now address real endpoints and expect one status each.
  - name: Get endpoint by slug
    request:
      url: "{base_url}/api/v1/_config/endpoints/-customers-"
      method: GET
      headers:
        X-Config-Token: "test-token"
        Authorization: "Bearer test-token"
    response:
      status_code: 200
      strict: false
      json:
        url-path: "/customers/"

  # A hyphen in the path is the case #123 was about: it must survive the
  # round trip instead of becoming a slash.
  - name: Get endpoint by slug - hyphenated path
    request:
      url: "{base_url}/api/v1/_config/endpoints/-json~1demo-"
      method: GET
      headers:
        X-Config-Token: "test-token"
        Authorization: "Bearer test-token"
    response:
      status_code: 200
      strict: false
      json:
        url-path: "/json-demo/"

  # There is deliberately NO percent-encoded url-path form. A case here once
  # asserted that `endpoints/customers%2F` resolved; it never passed, because
  # the routes are `<string>` (one path segment) and Crow percent-decodes
  # before matching, so the decoded `customers/` matches no route at all.
  # One endpoint, one name: the slug. See #123.
  - name: A percent-encoded path is not a second name for an endpoint
    request:
      url: "{base_url}/api/v1/_config/endpoints/customers%2F"
      method: GET
      headers:
        X-Config-Token: "test-token"
        Authorization: "Bearer test-token"
    response:
      status_code: 404

  - name: Get non-existent endpoint (404)
    request:
      url: "{base_url}/api/v1/_config/endpoints/nonexistent%2Fendpoint"
      method: GET
      headers:
        X-Config-Token: "test-token"
        Authorization: "Bearer test-token"
    response:
      status_code: [404, 401]

  - name: Get endpoint parameters
    request:
      url: "{base_url}/api/v1/_config/endpoints/-customers-/parameters"
      method: GET
      headers:
        X-Config-Token: "test-token"
        Authorization: "Bearer test-token"
    response:
      status_code: [200, 404, 401]

  - name: Validate endpoint configuration
    request:
      url: "{base_url}/api/v1/_config/endpoints/-customers-/validate"
      method: POST
      headers:
        X-Config-Token: "test-token"
        Authorization: "Bearer test-token"
        Content-Type: "application/json"
      json: {}
    response:
      status_code: [200, 400, 401]

  - name: Reload endpoint configuration
    request:
      url: "{base_url}/api/v1/_config/endpoints/-customers-/reload"
      method: POST
      headers:
        X-Config-Token: "test-token"
        Authorization: "Bearer test-token"
    response:
      status_code: [200, 404, 401]

