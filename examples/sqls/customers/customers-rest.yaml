# ====================================================================================
# REST ENDPOINT EXAMPLE
# ====================================================================================
# Pure REST endpoint using shared configuration components
# Demonstrates YAML includes to eliminate duplication

# REST endpoint definition
url-path: /customers/

# Include shared request parameters
{{include:request from customer-common.yaml}}

# Include shared authentication
{{include:auth from customer-common.yaml}}

# Include shared rate limiting
{{include:rate-limit from customer-common.yaml}}

# Include shared connection. The template is REST-specific: it reads the
# cache table the cache block below builds, not the parquet file.
{{include:connection from customer-common.yaml}}
template-source: customers-rest.sql

# REST-specific configuration
with-pagination: true

# REST-specific DuckLake caching. customers_cache.sql builds the table
# (CREATE OR REPLACE TABLE ... AS SELECT: a full refresh, since neither
# primary-key nor cursor is declared) and customers-rest.sql serves from it.
cache:
  enabled: true
  table: customers_rest_cache
  schema: analytics
  schedule: 5m
  template-file: customers_cache.sql
  retention:
    keep-last-snapshots: 3
    max-snapshot-age: 7d

heartbeat:
  enabled: false
