project-name: bigquery-procedure-example
project-description: Example calling BigQuery stored procedures via flAPI
version: 1.0.0

template:
  path: ./sqls-bigquery

connections:
  bigquery-kaercher:
    init: |
      INSTALL 'bigquery' FROM community;
      LOAD 'bigquery';
    properties:
      project_id: 'd-kaercher-kaadala-mgmt'

duckdb:
  db_path: ':memory:'
  access_mode: READ_WRITE

# Server settings. These are top-level keys, not a `server:` block -
# flAPI rejects a `server:` section.
http-port: 8080
http-host: 0.0.0.0
